[package]
name = "howllo-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
actix-ws = "0.3"
dashmap = "6"
base64 = "0.22"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.11", features = ["json"] }
serde_derive = "1.0"
actix-web-httpauth = "0.8"
derive_more = "0.99"
futures = "0.3"
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"
ipnet = "2"
csv = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
argon2 = "0.5"
rand = "0.8"
aes-gcm = "0.10"
