services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: howllo_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d howllo_test"]
      interval: 5s
      timeout: 5s
      retries: 10
