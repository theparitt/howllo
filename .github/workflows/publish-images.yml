name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: howllo-server/Dockerfile
          - name: app
            dockerfile: Dockerfile.frontend
            frontend: howllo-app
          - name: web
            dockerfile: Dockerfile.frontend
            frontend: howllo-web
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            FRONTEND=${{ matrix.frontend }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/howllo-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/howllo-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  quickstart-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Howllo and verify the sample board
        run: ./scripts/quickstart.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.quickstart -f compose.quickstart.yml logs --tail=100
      - name: Stop the smoke stack
        if: always()
        run: docker compose --env-file .env.quickstart -f compose.quickstart.yml down -v
